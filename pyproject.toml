[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fplbot"
version = "0.1.0"
description = "Local advisory tooling for Fantasy Premier League (UK)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "numpy>=2.0,<3",
  "pyarrow>=17,<20",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "scipy>=1.13,<2",
  "typer>=0.12,<0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21,<0.23",
  "ruff>=0.6",
]

[project.scripts]
fplbot = "fplbot.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
